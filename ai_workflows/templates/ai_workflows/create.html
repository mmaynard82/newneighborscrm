{% extends "ai_workflows/base.html" %}{% block content %}<div class="topbar"><h1>New transaction</h1><p class="muted">Enter only verified contract dates. Missing dates remain unconfirmed.</p></div><div class="card form-card"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<div class="actions"><button type="submit">Save transaction</button><a class="btn secondary" href="{% url 'ai_workbench' %}">Cancel</a></div></form></div>{% endblock %}
