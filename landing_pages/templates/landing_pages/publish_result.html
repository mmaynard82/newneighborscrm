<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordPress Publication Result</title></head><body><main><h1>WordPress Publication Result</h1><p>{{ page.title }}</p>{% if ok %}<p role="status">SUCCESS: WordPress confirmed the page is published.</p>{% if page.wordpress_url %}<p><a href="{{ page.wordpress_url }}">View published page</a></p>{% endif %}{% else %}<p role="alert">FAILED: Publication was not confirmed.</p><p>{{ detail }}</p>{% endif %}<p><a href="{% url 'landing_pages_list' %}">Return to Landing Pages</a></p></main></body></html>
